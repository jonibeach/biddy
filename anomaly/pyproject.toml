[project]
name = "biddy-anomaly"
version = "0.1.0"
description = "Anomalib training for the inspection cell, on the Intel GPU (XPU)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anomalib[openvino]>=2.7",
    # Same XPU builds as the Physical AI Studio venv, so training runs on the Intel GPU.
    "torch==2.11.0+xpu",
    "torchvision==0.26.0+xpu",
    "pyyaml",
]

# Same index setup as Studio's backend: PyPI first, the XPU index non-explicit so
# torch's own XPU dependencies (triton-xpu, oneAPI runtime wheels) resolve too.
[tool.uv]
package = false
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = false

[tool.uv.sources]
torch = { index = "pytorch-xpu" }
torchvision = { index = "pytorch-xpu" }

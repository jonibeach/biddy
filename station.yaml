# Station config for the inspection cell (cell/run.py). Robot calibration,
# serial numbers and camera identities are read from Physical AI Studio's
# database, so the cell drives exactly what Studio recorded with.

studio:
  db: ~/.local/share/physicalai/data/physicalai.db
  follower: SO101 Follower v2      # project_robots.name
  cameras: [top, wrist, inspection]  # project_cameras.name, same keys the policy was trained on

poses: poses.json  # written by: python -m cell.poses record

policy:
  # Which Studio model to run: "latest", "latest:<policy>" (e.g. latest:act),
  # a Studio model name, or a path to an exports/openvino folder.
  model: models/smolvla-ft-grasp55   # grasp-only policy (drop: grasp). Before: smolvla-ft-new52-from-all3 (full routine); tried: smolvla-ft-grasp107 (missed every grasp in grasp mode), smolvla-ft-new52-base (loops on the arm), smolvla-ft-all3-e2, smolvla-ft-all-e2, smolvla-ft-pislong-e3, latest
  # Optional second policy for the drop phase, e.g. ACT picks and brings the
  # brick to inspection, then SmolVLA sorts it using the verdict's task text.
  # null = the same policy does both.
  drop_model: null
  device: GPU              # OpenVINO device for the policy: CPU, GPU, NPU
  smoothing: 0.35          # EMA on the policy's actions (1 = off); the policy is jerkier than the demos
  gripper_gain: 1.0        # off: 2.5 fed back through the gripper state (policy saw 98, opened to 100, never left home). Was: widen the policy's gripper opening (it opens ~20, demos ~35): 20 -> 42, closing (<5) unchanged
  close_gate: false        # (tried; the shadow still fooled the policy) claw only closes with a coloured brick in the wrist camera's jaw gap (shadow-proof)
  interpolate: 3           # commands per action: 30 Hz actions -> 90 Hz smooth targets for the SO-101
  precision: auto          # auto (FP16, FP32 if FP16 gives NaN), f16, f32
  fps: 30
  mode: sync               # sync: plan each chunk from the current frame (async replayed ~140 ms stale chunks: jitter)
                           # rtc: Real-Time Chunking (Robotics AI Suite): infer in the background, each chunk
                           #      denoised to continue the last one; no pauses, no seams. Needs
                           #      scripts/export_rtc.py <model>; try with ./biddy run --policy-mode rtc
  rtc:
    execution_horizon: 15    # fresh actions per chunk before re-planning (<= chunk/2 = 25); lower = more reactive
    max_guidance_weight: 5.0 # how hard a new chunk is pulled onto the old tail; lower if it oscillates
  # Task text per phase; must match the task text the policies were trained on.
  # pick is optional (defaults to the good task: the pick looks the same).
  tasks:
    pick: null
    good: put the brick in the good bowl
    defective: put the brick in the defective bowl
    grasp: pick up the brick   # drop: grasp. grasp55/grasp107 are trained on this; use the good-bowl prompt for full-routine models
  # How the brick gets into the bowl (docs/data_collection.md protocol):
  #   task_switch: the policy runs the whole demo (hover, inspect, regrasp,
  #                inspect, drop, home); the cell scores every hold on the fly
  #                and switches the task to the defective bowl as soon as a
  #                face fails, which is before the drop.
  #   scripted:    the policy stops after inspection.holds_per_brick holds
  #                and the arm replays the recorded bowl pose.
  #   grasp:       the policy only picks and lifts (tasks.grasp); a script then
  #                shows the brick at the recorded inspection poses (same
  #                framing every time), and drops it at the recorded bowl pose.
  #                Needs good_bowl/defective_bowl in poses.json:
  #                ./biddy poses record --only good_bowl defective_bowl
  drop: grasp
  episode_timeout_s: 120   # one brick, home to home; demos take 30-40 s, but the policy now retries grasps by itself (12 tries in one run)

inspection:
  # drop: grasp only. After the first round of poses, set the brick down at
  # poses.regrip, roll the wrist by regrip_roll (normalized; ~50 = 90 deg),
  # grasp again and show the faces the jaws covered. Off: one round only.
  scripted_regrip: true    # only when every face so far passed
  regrip_roll: 50.0
  # Policy on the GPU, inspection on the NPU, control loop on the CPU: the
  # models never compete for one accelerator. `./biddy bench` compares devices.
  device: NPU
  # One Anomalib model per view: a crop box on a camera. The brick is held at
  # fixed spots in the inspection image, one view per spot: the sides in the
  # centre, the bottom (tubes) at the bottom right. The hover view is the wrist
  # camera before the grasp (top and front faces). A view is used when its
  # model folder exists. roi: [x, y, w, h] in the 640x480 image; set it with
  # ./biddy roi --view <view> <image>.
  views:
    side:            # centre of the inspection image; set from the demos with scripts/find_spots.py
      camera: inspection
      crop: brick    # square around the brick found inside roi (cell/brickcrop.py); roi is the search box
      roi: [100, 100, 540, 380]
      model: models/live2/side   # live hand-loaded + policy-held crops (before: models/live/side, models/side-int8)
      poses:         # arm poses (5 body joints) at which demos show this spot
        - [-23.0, -98.4, 98.0, 6.8, -0.7]
        - [5.2, -98.5, 98.0, 4.3, 2.3]
        # long bricks held by one end, wrist rolled about +-50 (dataset "test", scripts/find_spots.py)
        - [5.1, -98.9, 97.9, -7.2, -52.4]
        - [6.5, -98.9, 97.9, 2.1, 50.1]
        - [-22.6, -98.9, 97.9, -0.7, -53.4]
        - [-20.1, -98.9, 97.9, 8.2, 53.9]
    bottom:          # bottom of the inspection image, brick tilted to show its tubes
      camera: inspection
      crop: brick
      roi: [60, 220, 580, 260]   # wide: good demos show the bottom at the lower right, defective ones at the lower left
      model: models/live2/bottom   # live hand-loaded + policy-held crops (before: models/live/bottom, models/bottom-int8)
      poses:
        - [2.2, -17.6, -24.5, 98.4, -1.4]
        - [9.0, -30.0, -10.0, 90.0, 3.0]
        - [6.1, -22.0, -3.9, 73.5, 3.8]     # shallower tilt used in the defective demos
        - [8.7, -8.4, -19.9, 79.4, 7.5]
#    wrist:           # off: live hover framing differs from the demos, scored 1.0 on good bricks (AUROC 0.55)
#      camera: wrist
#      roi: [200, 60, 240, 240]
#      model: models/wrist-int8
#      hover: true
  # A hold: the arm still (joint speed below still_speed, units/s) for at least
  # hold_min_s, away from home (any body joint further than home_tolerance).
  still_speed: 15.0
  live_still_speed: 35.0   # live cell: the policy never stops as dead still as the demos
  live_spot_speed: 60.0    # live cell, within pose_tolerance of a spot: a slow pass still counts
  hold_min_s: 0.3
  home_tolerance: 8.0
  pose_tolerance: 10.0     # a hold is at a view's pose when every body joint is this close
  # The brick is at the inspection camera when its crop differs from the empty
  # view (grabbed at home) by at least presence_diff (mean pixel difference).
  presence_diff: 12.0
  frames: 3                # frames scored per hold; the median counts
  holds_per_brick: 4       # inspection holds per demo: back, bottom, side, side
  # Brick types by shape, never colour: the elongation (long / short side of
  # the brick's rotated box) at shape_view. Each type has its own route
  # (holds) and, later, its own anomaly models. Set long.min_elongation from
  # the "shape" column of ./biddy check once a few long-brick demos exist.
  shape_view: side
  brick_types:
    standard: {holds: 4}                       # 2x2 Duplo: 90 degree regrasp
    long: {min_elongation: null, holds: 4}     # held by one end, regrasped at the other
  # A brick whose run ends with no inspection hold was not grasped: pick again.
  max_regrasps: 2
  # Verdicts this close to a threshold are logged as uncertain.
  uncertain_margin: 0.05

# AprilTags (calibration/, cell/tags.py): compared with calibration/reference_<camera>.json
# with the arm at home before every brick. ./biddy run --no-tags skips it.
tags:
  enabled: true
  cameras: [top, inspection]
  # A camera listed here may move: its inspection crop boxes move with the
  # tags, up to max_correction_px.
  correct: [inspection]
  tolerance_px: 5.0        # a tag further than this from its reference has moved (jitter is up to 3 px)
  tolerances:              # per object (calibration/make_tags.py); falling bricks nudge the bowls
    good_bowl: 15.0
    defective_bowl: 15.0
  max_correction_px: 40.0
  frames: 5                # frames per check; the median position counts
  on_moved: pause          # pause: wait until it is put back; warn: log it and carry on

scripted:
  speed: 45.0              # units/s for scripted moves (80 shook a brick out of the jaws)
  gripper_open: 60.0       # gripper value that releases the brick

runs_dir: runs
